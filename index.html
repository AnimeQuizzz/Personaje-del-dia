<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personaje de Anime del Día</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>✨ Personaje de Anime del Día ✨</h1>
  </header>

  <main>
    <div class="card">
       <img id="character-image" src="imagenes/mono.png" alt="Personaje misterioso" />
      <p><em>¿Puedes adivinar quién es este personaje?</em></p>

      <form id="guess-form">
        <input type="text" id="guess" placeholder="Escribe un nombre..." required />
        <button type="submit">Adivinar</button>
      </form>

      <p id="result"></p>
    </div>
  </main>

  <footer>
    <p>Hecho con 💖 por [Tu Nombre]</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
